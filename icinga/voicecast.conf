// Install the script and credentials on every node that executes notifications.
template NotificationCommand "voicecast-base" {
  command = [ "/usr/bin/python3", "/etc/icinga2/scripts/voicecast-notification.py" ]
  timeout = 30s
  arguments = {
    "--config" = "/etc/icinga2/voicecast.json"
  }
  env = {
    VOICECAST_TO = "$user.vars.voicecast_phone$"
    VOICECAST_TYPE = "$notification.type$"
    VOICECAST_HOST = "$host.display_name$"
  }
}

object NotificationCommand "voicecast-host-notification" {
  import "voicecast-base"
  env += {
    VOICECAST_STATE = "$host.state$"
    VOICECAST_OUTPUT = "$host.output$"
  }
}

object NotificationCommand "voicecast-service-notification" {
  import "voicecast-base"
  env += {
    VOICECAST_SERVICE = "$service.display_name$"
    VOICECAST_STATE = "$service.state$"
    VOICECAST_OUTPUT = "$service.output$"
  }
}

// Replace the example number before opting any objects in.
object User "voicecast-oncall" {
  display_name = "VoiceCast on-call"
  enable_notifications = true
  vars.voicecast_phone = "+31612345678"
}

apply Notification "voicecast-host" to Host {
  command = "voicecast-host-notification"
  users = [ "voicecast-oncall" ]
  interval = 0 // No periodic repeat calls.
  types = [ Problem, Recovery, Custom ]
  states = [ Up, Down ]
  assign where host.vars.voicecast_notifications == true
}

apply Notification "voicecast-service" to Service {
  command = "voicecast-service-notification"
  users = [ "voicecast-oncall" ]
  interval = 0
  types = [ Problem, Recovery, Custom ]
  states = [ OK, Warning, Critical, Unknown ]
  assign where service.vars.voicecast_notifications == true
}
